[project]
name = "market-hunter-backend"
version = "0.1.0"
description = "Local job aggregation and application tracking"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
